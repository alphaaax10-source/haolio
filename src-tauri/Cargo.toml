[package]
name = "haolio"
version = "0.1.0"
description = "Haolio — Offline Infinite Canvas & Mind Mapping"
authors = ["Haolio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "haolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
